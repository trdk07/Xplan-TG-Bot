name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Telegram / admin
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing GitHub repository secret: CLOUDFLARE_API_TOKEN"
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing GitHub repository secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-discord:
    name: Build and deploy Discord
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/discord-bot
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/discord-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test Worker runtime
        run: npm run test:runtime

      - name: Validate Discord Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing GitHub repository secret: DISCORD_CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_TOKEN"
            exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DISCORD_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}

      # Keep the existing Discord Worker, account and Durable Object migrations.
      # Its account_id comes from this app's wrangler.jsonc, not the TG account secret.
      # Runtime secrets remain on the existing Worker; no secret bulk upload or setup scripts.
      - name: Deploy Discord Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DISCORD_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
